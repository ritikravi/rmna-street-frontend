<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Open Graph Image - Dark textured background with RMNA logo -->
  <defs>
    <pattern id="texture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#0a0a0a"/>
      <path d="M0 0 L100 100 M100 0 L0 100" stroke="#1a1a1a" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#texture)"/>
  <rect width="1200" height="630" fill="#000000" opacity="0.7"/>
  
  <!-- RMNA Logo centered -->
  <g transform="translate(150, 180)">
    <!-- R -->
    <path d="M0 20 L0 140 L35 140 L35 90 L70 90 L70 55 L35 55 L35 20 Z M35 20 L85 20 C105 20 115 35 115 55 C115 75 105 90 85 90 L70 90" fill="#FFFFFF"/>
    <!-- Red slash through R -->
    <line x1="85" y1="90" x2="35" y2="140" stroke="#BB0000" stroke-width="12" stroke-linecap="round"/>

    <!-- M -->
    <path d="M135 20 L135 140 L170 140 L170 70 L215 140 L260 70 L260 140 L295 140 L295 20 L260 20 L215 95 L170 20 Z" fill="#FFFFFF"/>

    <!-- N -->
    <path d="M315 20 L315 140 L350 140 L350 70 L420 140 L455 140 L455 20 L420 20 L420 95 L350 20 Z" fill="#FFFFFF"/>

    <!-- A -->
    <path d="M475 140 L510 20 L545 20 L510 140 Z M475 20 L440 140 L475 140 Z" fill="#FFFFFF"/>
    <!-- Red slash through A -->
    <line x1="545" y1="20" x2="475" y2="140" stroke="#BB0000" stroke-width="12" stroke-linecap="round"/>
  </g>
  
  <!-- BUILT DIFFERENT tagline -->
  <g transform="translate(600, 420)">
    <line x1="-180" y1="0" x2="-120" y2="0" stroke="#BB0000" stroke-width="3"/>
    <text x="0" y="5" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="12" text-anchor="middle">BUILT DIFFERENT</text>
    <line x1="120" y1="0" x2="180" y2="0" stroke="#BB0000" stroke-width="3"/>
  </g>
</svg>
